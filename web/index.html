  // ================= slash commands (local, no tokens) =================
  const HELP = [
    ["/roll", "roll everything the GM asked you for, in order (same as the buttons on the left)"],
    ["/remember name", "ask the GM to remember someone (everyone sees it)"],
    ["/people", "the people the GM remembers"],
    ["/party", "everyone in the party file, with the world clock"],
    ["/sheet name", "one character's sheet (name can be partial)"],
    ["/log", "the most recent part of the campaign log"],
    ["/rules", "the current rules draft"],
    ["/economy", "money, prices, gear tiers and item scales"],
    ["/world word", "search the canon, e.g. /world Kalvane"],
    ["/table", "who is present and who has answered this round"],
    ["/codex", "open the Codex"],
    ["/help", "this list"],
  ];

  async function runCommand(text) {
    const [cmd, ...rest] = text.slice(1).trim().split(/\s+/);
    const arg = rest.join(" ").trim();
    const c = (cmd || "").toLowerCase();

    if (c === "codex") return openCodex();
    if (c === "remember") {
      if (!arg) return note("REMEMBER", "<p>Remember whom? <code>/remember Teodor</code> asks the GM to keep that person in its memory.</p>");
      send({ t: "remember", seatId: mySeat, name: arg });
      return;
    }
    if (c === "people") { codexTab = "people"; document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x.dataset.tab === "people")); return openCodex(); }
    if (c === "roll" || c === "r") {
      const owed = (table.requests || []).filter((r) => r.seatId === mySeat);
      if (!owed.length) return note("ROLL", '<p class="muted">Nothing to roll right now. When the GM needs a roll, buttons appear on the left, and <code>/roll</code> rolls them all in order. The idle die at the bottom left is always there for fidgeting.</p>');
      send({ t: "rollAll", seatId: mySeat });
      return;
    }
    if (c === "help" || !c) return note("COMMANDS", helpHtml());
    if (c === "table") {
      const ans = new Map(pending().map((m) => [m.seatId, m.kind]));
      return note("TABLE · ROUND " + table.round, "<ul>" + table.seats.map((s) => "<li><strong>" + escapeHtml(seatLabel(s)) + "</strong> " +
        (s.present ? (ans.get(s.id) === "act" ? "acted" : ans.get(s.id) === "roll" ? "rolled" : ans.get(s.id) === "pass" ? "passed" : "waiting") : "absent") + "</li>").join("") + "</ul>");
    }

    let st;
    try { st = await loadState(); } catch (err) {
      if (err.message !== "locked") pushError("Could not read the repo: " + err.message);
      return;
    }

    if (c === "party") note("PARTY", renderParty(partyRaw(st)));
    else if (c === "sheet") {
      const { members } = parseParty(partyRaw(st));
      if (!members.length) return note("SHEET", '<p class="muted">The party file is empty. Characters are made in session 1.</p>');
      const found = arg ? members.filter((m) => String(m.name || "").toLowerCase().includes(arg.toLowerCase()))
        : members.length === 1 ? members : [];
      if (found.length === 1) note("SHEET", renderMember(found[0]));
      else note("SHEET", "<p>" + (arg && !found.length ? "No one called “" + escapeHtml(arg) + "”. " : "Whose sheet? ") +
        "Party: " + members.map((m) => "<code>" + escapeHtml(m.name || "unnamed") + "</code>").join(", ") + "</p>");
    } else if (c === "log") {
      const tail = st.log.length > 2500 ? "…\n\n" + st.log.slice(st.log.lastIndexOf("\n## ", st.log.length - 2500) + 1 || -2500) : st.log;
      note("LOG", renderMarkdown(tail) || '<p class="muted">No log yet.</p>');
    } else if (c === "rules") note("RULES", renderMarkdown(st.rules) || '<p class="muted">No rules yet.</p>');
    else if (c === "economy" || c === "prices") note("ECONOMY", renderMarkdown(st.economy) || '<p class="muted">No economy rules yet.</p>');
    else if (c === "world" || c === "canon") {
      if (!arg) return note("WORLD", "<p>The canon is long. Search it with <code>/world word</code>, or open the <code>/codex</code> for the whole thing.</p>");
      const blocks = cleanMd(st.canon).split(/\n{2,}/).filter((b) => b.toLowerCase().includes(arg.toLowerCase()));
      note("WORLD · " + arg.toUpperCase(), blocks.length
        ? renderMarkdown(blocks.slice(0, 4).join("\n\n")) + (blocks.length > 4 ? '<p class="muted">' + (blocks.length - 4) + " more passages in the Codex.</p>" : "")
        : '<p class="muted">The canon says nothing about “' + escapeHtml(arg) + "”.</p>");
    } else note("COMMANDS", "<p>Unknown command <code>/" + escapeHtml(cmd) + "</code>.</p>" + helpHtml());
  }

  function helpHtml() {
    return "<ul>" + HELP.map(([k, v]) => "<li><code>" + k + "</code> " + v + "</li>").join("") + "</ul>" +
      '<p class="muted">Commands are only shown on your screen, never cost tokens, and the GM never sees them.</p>';
  }

  function note(label, html) { notes.push({ ts: Date.now(), label, html }); render(); }

  // ================= dice display =================
  function describeRoll(r) {
    return (r.parts || []).map((p, i) => {
      if ("mod" in p) return (p.mod < 0 ? "− " : i ? "+ " : "") + Math.abs(p.mod);
      const shown = p.rolls.length > 1 && p.kept.length < p.rolls.length
        ? `[${p.rolls.join(", ")}]→${p.kept.join("+")}`
        : p.rolls.length > 1 ? `(${p.rolls.join("+")})` : String(p.rolls[0]);
      return (p.subtotal < 0 ? "− " : i ? "+ " : "") + shown;
    }).join(" ");
  }

  // "/roll adv d20 + 5 stealth" -> { expr: "adv d20 + 5", label: "stealth" }
  function splitRoll(text) {
    const tokens = text.trim().split(/\s+/).filter(Boolean);
    const isDice = (t) => /^(adv|advantage|dis|disadvantage|[+-]|[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*[+-]?)$/i.test(t);
    let i = 0;
    while (i < tokens.length && isDice(tokens[i])) i++;
    return { expr: tokens.slice(0, i).join(" "), label: tokens.slice(i).join(" ") };
  }

  // ================= renderers =================
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
  }
  function cleanMd(text) {
    return String(text || "").replace(/<!--[\s\S]*?-->/g, "").replace(/\\([\\`*_{}\[\]()#+\-.!>])/g, "$1").trim();
  }
  function renderMarkdown(text) {
    const src = cleanMd(text);
    if (!src) return "";
    let out = "", para = [], list = [], table = [], quote = [];
    const flushPara = () => { if (para.length) { out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
    const flushList = () => { if (list.length) { out += "<ul>" + list.map((l) => "<li>" + inline(l) + "</li>").join("") + "</ul>"; list = []; } };
    const flushQuote = () => { if (quote.length) { out += "<blockquote>" + quote.map(inline).join("<br>") + "</blockquote>"; quote = []; } };
    const cells = (row) => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
    const flushTable = () => {
      if (!table.length) return;
      const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r));
      const [head, ...bodyRows] = rows;
      out += '<div class="tbl"><table><thead><tr>' + cells(head).map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        bodyRows.map((r) => "<tr>" + cells(r).map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
      table = [];
    };
    const flushAll = () => { flushPara(); flushList(); flushTable(); flushQuote(); };
    for (const raw of src.split("\n")) {
      const line = raw.replace(/\s+$/, "");
      let m;
      if (/^\s*\|/.test(line)) { flushPara(); flushList(); flushQuote(); table.push(line); continue; }
      if (table.length) flushTable();
      if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); quote.push(m[1]); continue; }
      if (quote.length) flushQuote();
      if (!line.trim()) { flushPara(); flushList(); }
      else if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushPara(); flushList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
      else if (/^[IVXL]+\.\s+[A-Z][A-Z\s&—,'-]+(\s*\([^)]*\))?$/.test(line.trim())) { flushPara(); flushList(); out += "<h2>" + inline(line.trim()) + "</h2>"; }
      else if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushPara(); flushList(); out += "<hr>"; }
      else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushPara(); list.push(m[1]); }
      else { flushList(); para.push(line.trim()); }
    }
    flushAll();
    return out;
  }
  function parseParty(raw) {
    let data;
    try { data = JSON.parse(raw || "{}"); } catch { return { error: true, raw }; }
    let members = data.party ?? data.characters ?? [];
    if (!Array.isArray(members)) members = Object.entries(members).map(([name, v]) => ({ name, ...(v || {}) }));
    return { data, members };
  }
  function renderValue(v) {
    if (v === null || v === undefined || v === "") return '<span class="muted">none</span>';
    if (Array.isArray(v)) {
      if (!v.length) return '<span class="muted">none</span>';
      if (v.every((x) => typeof x !== "object" || x === null)) return escapeHtml(v.join(", "));
      return v.map(renderValue).join("");
    }
    if (typeof v === "object") return renderKv(v);
    return escapeHtml(v);
  }
  function renderKv(obj) {
    return '<dl class="kv">' + Object.entries(obj).map(([k, v]) => "<dt>" + escapeHtml(k.replace(/_/g, " ")) + "</dt><dd>" + renderValue(v) + "</dd>").join("") + "</dl>";
  }
  function renderCard(member) {
    const { name, ...rest } = member;
    return '<div class="card"><h3>' + escapeHtml(name || "Unnamed") + "</h3>" +
      (Object.keys(rest).length ? renderKv(rest) : '<p class="muted">An empty sheet.</p>') + "</div>";
  }
  function renderParty(raw) {
    const p = parseParty(raw);
    if (p.error) return '<p class="muted">party.json is not valid JSON:</p><pre>' + escapeHtml(raw) + "</pre>";
    const { data, members } = p;
    let html = "";
    if (table && table.clock) html += '<div class="clock">' + escapeHtml(table.clock).toUpperCase() + "</div>";
    if (data.world_clock) html += '<div class="clock">' + escapeHtml(data.world_clock).toUpperCase() +
      (data.location ? " · " + escapeHtml(data.location).toUpperCase() : "") + "</div>";
    html += members.length ? members.map(renderMember).join("") : '<p class="muted">No characters yet. Each player makes one with Create character.</p>';
    return html;
  }

  // ================= character sheets =================
  // The table holds the live sheets; the repo file catches up on Save and End.
  function sheetByName(name) {
    const k = String(name || "").trim().toLowerCase();
    return (table && table.party || []).find((c) => c.stats && String(c.name || "").trim().toLowerCase() === k) || null;
  }
  function mySheet() {
    const me = seatById(mySeat);
    const c = me && me.character ? sheetByName(me.character) : null;
    return c && !c.dead ? c : null;
  }
  // The party file as JSON text, with the live sheets written in.
  function partyRaw(st) {
    if (!table || !table.party) return st.party;
    let data = {};
    try { data = JSON.parse(st.party || "{}"); } catch {}
    data.party = table.party.map(({ d, ...c }) => c);
    return JSON.stringify(data);
  }
  function renderPartyTab() {
    const body = $("codex-body");
    body.className = "codex-body md";
    if (table && table.party) {
      body.innerHTML = renderParty(partyRaw(codexState || { party: "{}" }));
      wireSheetControls(body);
      $("codex-status").textContent = "Live from the table" + (table.partyUnsaved ? " · changes since the last save" : "");
    } else if (codexState) {
      body.innerHTML = renderParty(codexState.party);
    }
  }
  function renderMember(m) {
    const live = m && m.stats ? sheetByName(m.name) : null;
    return live && live.d ? renderSheet(live) : renderCard(m);
  }

  const signed = (n) => (n >= 0 ? "+" : "") + n;
  const playsAs = (v) => (v === 10 ? 11 : v);
  function statVal(c, k) { return c.capstone === k ? 13 : c.stats[k]; }
  function cost(v) { return v - 5 + (v >= 10 ? 1 : 0); }

  function renderSheet(c) {
    const d = c.d, mine = mySheet() === c || (mySheet() && mySheet().name === c.name);
    const R = rules || {};
    const S = R.stats || {}, SK = R.skills || {}, RK = R.ranks || [], MK = R.marks || [];
    const me = seatById(mySeat);
    const player = c.player ? " · " + escapeHtml(c.player) : "";
    let h = `<div class="card sheet" data-sheet="${escapeHtml(c.name)}"><h3>${escapeHtml(c.name)}<small>LEVEL ${d.level}${player}${mine ? " · YOURS" : ""}</small></h3>`;
    const state = c.dead ? '<span class="bad">DEAD</span>'
      : c.dying ? (c.dying.stable ? '<span class="bad">UNCONSCIOUS · STABLE</span>' : `<span class="bad">DYING · saves ${c.dying.s}✓ ${c.dying.f}✗</span>`)
      : `HP ${c.hp}/${d.maxHp}`;
    h += `<div class="vit"><span>${state}</span><span>AC ${d.ac}</span><span>Resonance ${+(+c.pool).toFixed(2)}/${d.maxPool} · tier ${d.maxTier}</span>` +
      `<span>${+(+c.purse).toFixed(2)} cv</span><span>Lucky breaks ${Math.max(0, d.luckyBreaks - (c.luckUsed || 0))}/${d.luckyBreaks}</span>` +
      `<span>Initiative ${signed(d.initiative)}</span><span>Carry ${d.carryKg} kg</span>${d.critOn === 19 ? "<span>Crits 19–20</span>" : ""}</div>`;
    h += '<div class="stats">';
    for (const k of Object.keys(S)) {
      const v = statVal(c, k), canRaise = mine && d.unspent > 0 && c.capstone !== k && v < 10 && cost(v + 1) - cost(v) <= d.unspent && !c.dead;
      h += `<div class="stat${c.capstone === k ? " cap" : ""}"><small>${escapeHtml(S[k])}</small><b>${v}</b><i>${signed(playsAs(v) - 5)}</i>` +
        (mine && d.unspent > 0 && c.capstone !== k ? `<button type="button" data-raise="${k}" ${canRaise ? "" : "disabled"} title="${v === 9 ? "The step to 10 costs 2" : "Spend a point"}">+</button>` : "") + "</div>";
    }
    h += "</div>";
    if (mine && d.unspent > 0) h += `<div class="notice">${d.unspent} stat point${d.unspent === 1 ? "" : "s"} to spend. Use the + on a stat.</div>`;
    if (mine && d.level >= 50 && !c.capstone) {
      h += '<div class="notice">Level 50: choose your capstone. One stat becomes 13, with its ability:<br>' +
        Object.keys(S).map((k) => `<button type="button" class="ghost" data-cap="${k}" title="${escapeHtml((R.capstones || {})[k]?.[1] || "")}">${escapeHtml(S[k])}: ${escapeHtml((R.capstones || {})[k]?.[0] || "")}</button>`).join("") + "</div>";
    }
    if (c.capstone && R.capstones) h += `<div class="notice">Capstone · ${escapeHtml(R.capstones[c.capstone][0])}: ${escapeHtml(R.capstones[c.capstone][1])}</div>`;
    h += `<h4>SKILLS · ${d.ranks} RANKS EARNED</h4><table class="sk">`;
    for (const k of Object.keys(SK)) {
      const sk = (c.skills || {})[k] || { rank: 0, marks: 0 };
      const need = MK[sk.rank + 1];
      const pct = need ? Math.round(100 * (sk.marks || 0) / need) : 100;
      h += `<tr class="${sk.rank ? "" : "zero"}"><td>${escapeHtml(SK[k])}</td><td>${escapeHtml(RK[sk.rank] || "")}${sk.rank > 1 ? " " + signed(sk.rank - 1) : ""}</td>` +
        `<td class="r">${need ? `${sk.marks || 0}/${need}<span class="bar"><span style="width:${pct}%"></span></span>` : "mastered"}</td></tr>`;
    }
    h += "</table>";
    h += "<h4>CARRYING</h4>";
    h += (c.items || []).length ? '<ul class="items">' + c.items.map((it, i) => {
      const tags = [it.equipped ? "worn" : "", it.tier ? "tier " + it.tier : "", it.quality, it.condition, it.legality && it.legality !== "Legal" ? it.legality : "",
        it.ac ? "AC +" + it.ac : "", it.damage ? it.damage : "", it.shieldPool ? "shield " + it.shieldPool : ""].filter(Boolean).join(" · ");
      const wear = mine && ["armor", "shield", "device"].includes(it.kind) ? `<button type="button" class="ghost" data-equip="${i}">${it.equipped ? "Take off" : "Wear"}</button>` : "";
      return `<li><span>${escapeHtml(it.name)} <small>${escapeHtml(tags)}</small></span>${wear}</li>`;
    }).join("") + "</ul>" : '<p class="muted">Nothing.</p>';
    if ((c.scars || []).length || c.scarsOwed) {
      h += "<h4>SCARS</h4>" + (c.scars || []).map((x) => `<p>${escapeHtml(x)}</p>`).join("") +
        (c.scarsOwed ? `<p class="muted">${c.scarsOwed} still to be written by the GM.</p>` : "");
    }
    if (c.backstory) h += `<h4>BACKSTORY</h4><div class="back">${escapeHtml(c.backstory)}</div>`;
    return h + "</div>";
  }

  function wireSheetControls(root) {
    root.querySelectorAll("[data-raise]").forEach((b) => b.addEventListener("click", () => send({ t: "raise", seatId: mySeat, stat: b.dataset.raise })));
    root.querySelectorAll("[data-cap]").forEach((b) => b.addEventListener("click", () => {
      const label = (rules && rules.stats[b.dataset.cap]) || b.dataset.cap;
      if (confirm(`Take ${label} 13 as your capstone? This is for good.`)) send({ t: "capstone", seatId: mySeat, stat: b.dataset.cap });
    }));
    root.querySelectorAll("[data-equip]").forEach((b) => b.addEventListener("click", () => send({ t: "equip", seatId: mySeat, index: Number(b.dataset.equip) })));
  }

  // ---------- the creation screen ----------
  function closeCreate() { const o = $("create"); if (o) o.remove(); }
  function openCreate() {
    if (!rules) return pushError("Still loading the rules from the table. Try again in a moment.");
    closeCreate();
    const keys = Object.keys(rules.stats);
    const st = Object.fromEntries(keys.map((k) => [k, 5]));
    const picks = new Set();
    const ov = document.createElement("div");
    ov.className = "create-ov"; ov.id = "create";
    ov.innerHTML = `<div class="create" role="dialog" aria-label="Create a character">
      <h2>A NEW CHARACTER</h2>
      <p class="muted small">Every stat starts at 5. Raising one costs a point; lowering one frees a point, down to 1. The step from 9 to 10 costs 2. Nothing is free: every point you raise has to come from somewhere. Skills all start untrained and are learned by using them.</p>
      <div class="lbl">Name</div><input class="field" id="cr-name" maxlength="40" autocomplete="off">
      <div class="lbl">Stats</div><div class="cr-bal" id="cr-bal"></div>
      <div class="cr-stats" id="cr-stats"></div>
      <div class="cr-derived" id="cr-derived"></div>
      <div class="lbl">Backstory <small>yours to write; the world will hold you to it, but it can't rewrite the canon</small></div>
      <textarea class="field" id="cr-back" rows="5" maxlength="4000" placeholder="Where you come from, who you served, what you believe, what you owe."></textarea>
      <div class="lbl">Starting kit · ${rules.purse} cv, clothes, a pack, and ${rules.picks} of these</div>
      <div class="cr-kit" id="cr-kit"></div>
      <div class="ebar"><span class="emsg" id="cr-msg"></span><button type="button" class="ghost" id="cr-cancel">Cancel</button><button type="button" class="btn" id="cr-go">Create</button></div>
    </div>`;
    document.body.appendChild(ov);

    const draw = () => {
      const bal = -keys.reduce((n, k) => n + cost(st[k]), 0);
      const b = $("cr-bal");
      b.className = "cr-bal " + (bal === 0 ? "even" : bal < 0 ? "over" : "left");
      b.textContent = bal === 0 ? "Balanced. Every point is placed." : bal > 0 ? `${bal} point${bal === 1 ? "" : "s"} freed and not yet placed.` : `Over by ${-bal}: lower something.`;
      $("cr-stats").innerHTML = keys.map((k) => `<div class="cr-stat"><span>${escapeHtml(rules.stats[k])}</span>
        <button type="button" data-dn="${k}" ${st[k] <= 1 ? "disabled" : ""} aria-label="Lower ${escapeHtml(rules.stats[k])}">−</button>
        <b>${st[k]}</b>
        <button type="button" data-up="${k}" ${st[k] >= 10 ? "disabled" : ""} aria-label="Raise ${escapeHtml(rules.stats[k])}" title="${st[k] === 9 ? "The step to 10 costs 2" : ""}">+</button>
        <i>${signed(playsAs(st[k]) - 5)}</i></div>`).join("");
      $("cr-stats").querySelectorAll("[data-up]").forEach((x) => x.addEventListener("click", () => { st[x.dataset.up]++; draw(); }));
      $("cr-stats").querySelectorAll("[data-dn]").forEach((x) => x.addEventListener("click", () => { st[x.dataset.dn]--; draw(); }));
      const E = playsAs(st.endurance), A = playsAs(st.agility) - 5, Rz = playsAs(st.resonance), L = playsAs(st.luck) - 5;
      const armor = [...picks].map((id) => rules.kit.find((x) => x.id === id)).filter((x) => x && x.kind === "armor").reduce((m, x) => Math.max(m, x.ac || 0), 0);
      $("cr-derived").textContent = `HP ${8 + 2 * E} · AC ${10 + A + armor} · Resonance pool ${Rz * 4}, casts up to tier ${Math.min(5, Math.floor(Rz / 2))} · lucky breaks ${Math.max(0, L)} a day${st.luck >= 9 ? " · crits on 19–20" : ""} · carry ${st.strength * 10} kg`;
      $("cr-go").disabled = bal !== 0 || picks.size !== rules.picks;
    };
    const groups = [["WEAPONS", "weapon"], ["ARMOR", "armor"], ["ARMOR", "shield"], ["TOOLS", "tool"]];
    const cols = { WEAPONS: [], ARMOR: [], TOOLS: [] };
    for (const it of rules.kit) {
      const g = groups.find(([, kind]) => kind === it.kind);
      cols[g ? g[0] : "TOOLS"].push(it);
    }
    $("cr-kit").innerHTML = Object.entries(cols).map(([h, list]) => `<div><h5>${h}</h5>` + list.map((it) =>
      `<label><input type="checkbox" value="${it.id}"> ${escapeHtml(it.name)} <small class="muted">${escapeHtml((rules.skills[it.skill || it.armor] || "") + (it.damage ? " · " + it.damage : it.ac ? " · AC +" + it.ac : it.shieldPool ? " · pool " + it.shieldPool : ""))}</small></label>`
    ).join("") + "</div>").join("");
    $("cr-kit").querySelectorAll("input").forEach((x) => x.addEventListener("change", () => {
      if (x.checked) { if (picks.size >= rules.picks) { x.checked = false; $("cr-msg").textContent = `Only ${rules.picks}. Uncheck one first.`; return; } picks.add(x.value); }
      else picks.delete(x.value);
      $("cr-msg").textContent = "";
      draw();
    }));
    $("cr-cancel").addEventListener("click", closeCreate);
    $("cr-go").addEventListener("click", () => {
      const name = $("cr-name").value.trim();
      if (!name) { $("cr-msg").textContent = "Your character needs a name."; return; }
      $("cr-msg").textContent = "Writing you into the world…";
      $("cr-go").disabled = true;
      ov.dataset.want = name;
      send({ t: "create", seatId: mySeat, sheet: { name, backstory: $("cr-back").value, stats: st, items: [...picks] } });
    });
    draw();
    $("cr-name").focus();
  }

  // ================= boot =================
  show("gate");
  if (password) {
    checkPassword(password).then((ok) => { if (ok) connect(); else store.del("sessionStorage", "eidholm.pw"); });
  }
</script>
</body>
</html>
