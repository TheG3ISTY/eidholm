<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eidholm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0a;
    --bg-2: #141210;
    --panel: #1a1714;
    --line: #2e2822;
    --ink: #e6dccb;
    --ink-dim: #9a8f7e;
    --ember: #d9773a;
    --ember-dim: #8a4a25;
    --brass: #c4a46a;
    --glass: #7fb3b0;
    --danger: #c0533f;
    --display: "Cormorant Garamond", Georgia, serif;
    --body: "EB Garamond", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(217,119,58,0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 110%, rgba(127,179,176,0.06), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.6;
  }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- gate & seat screens ---------- */
  .screen { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .gate-card { width: 100%; max-width: 420px; text-align: center; }
  .sigil {
    width: 72px; height: 72px; margin: 0 auto 20px;
    border: 1px solid var(--brass); transform: rotate(45deg);
    display: grid; place-items: center; box-shadow: 0 0 40px rgba(217,119,58,0.15);
  }
  .sigil span { transform: rotate(-45deg); font-family: var(--display); font-size: 30px; color: var(--ember); }
  .gate-card h1 { font-family: var(--display); font-weight: 600; font-size: 52px; letter-spacing: 0.18em; margin: 0; padding-left: 0.18em; }
  .gate-card h2 { font-family: var(--display); font-weight: 600; font-size: 30px; letter-spacing: 0.1em; margin: 0 0 4px; }
  .gate-card .sub { color: var(--ink-dim); font-style: italic; margin: 4px 0 28px; }
  .gate-row { display: flex; gap: 8px; }
  .field {
    width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 2px;
    padding: 11px 14px; font-family: var(--mono); font-size: 15px; outline: none;
  }
  .field:focus { border-color: var(--brass); }
  .gate-row .field { flex: 1; }
  .btn {
    background: transparent; border: 1px solid var(--brass); color: var(--brass);
    padding: 10px 18px; border-radius: 2px; cursor: pointer;
    font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.08em;
    transition: background 0.15s, color 0.15s;
  }
  .btn:hover:not(:disabled) { background: var(--brass); color: var(--bg); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.quiet { border-color: var(--line); color: var(--ink-dim); }
  .btn.quiet:hover:not(:disabled) { background: var(--line); color: var(--ink); }
  .gate-msg { min-height: 1.6em; margin-top: 14px; color: var(--danger); font-style: italic; }
  .seat-list { display: grid; gap: 8px; margin-bottom: 24px; text-align: left; }
  .seat-pick {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    background: var(--bg-2); border: 1px solid var(--line); padding: 10px 14px; cursor: pointer; border-radius: 2px;
  }
  .seat-pick:hover { border-color: var(--brass); }
  .seat-pick b { font-family: var(--display); font-size: 21px; font-weight: 600; }
  .seat-pick small { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .divider { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ink-dim); margin: 6px 0 12px; }
  .stack { display: grid; gap: 8px; }

  /* ---------- game ---------- */
  #game { display: none; height: 100%; flex-direction: column; }
  header.bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: rgba(12,11,10,0.85); backdrop-filter: blur(6px); flex-wrap: wrap;
  }
  .brand { font-family: var(--display); font-weight: 600; letter-spacing: 0.18em; font-size: 22px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 4px 10px; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .seg button.on { background: var(--ember-dim); color: var(--ink); }
  .ghost {
    background: transparent; border: 1px solid var(--line); border-radius: 2px;
    padding: 4px 10px; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
  }
  .ghost:hover { color: var(--ink); border-color: var(--ink-dim); }
  .meter { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
  .meter b { color: var(--glass); font-weight: 500; }
  .conn { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: inline-block; }
  .conn.live { background: var(--glass); }

  /* roster strip */
  .roster {
    display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--line); background: rgba(20,18,16,0.7);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto;
    border: 1px solid var(--line); border-radius: 2px; padding: 3px 4px 3px 10px;
    font-family: var(--mono); font-size: 12px; white-space: nowrap;
  }
  .chip.me { border-color: var(--brass); }
  .chip.absent { opacity: 0.5; }
  .chip .name { color: var(--ink); }
  .chip .status { color: var(--ink-dim); }
  .chip .status.acted { color: var(--ember); }
  .chip .status.passed { color: var(--glass); }
  .chip button {
    background: transparent; border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; color: var(--ink-dim); padding: 1px 6px;
  }
  .chip button:hover { color: var(--ink); border-color: var(--ink-dim); }
  .chip button.save { border-color: var(--brass); color: var(--brass); }
  .chip button.save:hover:not(:disabled) { background: var(--brass); color: var(--bg); }
  .chip button:disabled { opacity: 0.5; cursor: default; }

  .stage { flex: 1; display: flex; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 28px 16px 12px; }
  #rail {
    width: 168px; flex: 0 0 auto; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    padding: 14px 10px; overflow-y: auto; background: rgba(20,18,16,0.55);
  }
  #rail-rolls { display: flex; flex-direction: column; gap: 8px; }
  .rail-h { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ember); }
  .rbtn {
    display: grid; gap: 2px; text-align: left; cursor: pointer;
    background: var(--bg-2); border: 1px solid var(--brass); color: var(--ink); border-radius: 2px; padding: 8px 9px;
    animation: pop 0.25s ease-out;
  }
  .rbtn:hover:not(:disabled) { background: var(--brass); color: var(--bg); }
  .rbtn:hover:not(:disabled) small { color: var(--bg); }
  .rbtn:disabled { opacity: 0.45; cursor: default; }
  .rbtn b { font-family: var(--display); font-size: 17px; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; hyphens: auto; }
  .rbtn small { overflow-wrap: anywhere; }
  .rbtn small { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); letter-spacing: 0.04em; }
  .rbtn .n { font-family: var(--mono); font-size: 10px; color: var(--ember); }
  .rall { font-family: var(--mono); font-size: 11px; }
  @keyframes pop { from { transform: translateX(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .idle { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
  #idle-roll { cursor: pointer; background: transparent; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 2px; padding: 8px; font-family: var(--mono); font-size: 13px; }
  #idle-roll:hover { color: var(--ink); border-color: var(--ink-dim); }
  #idle-pick { background: var(--bg-2); border: 1px solid var(--line); color: var(--ink-dim); font-family: var(--mono); font-size: 12px; padding: 4px; border-radius: 2px; }
  .idle-out { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); min-height: 1.3em; text-align: center; }
  .idle-out b { color: var(--glass); font-size: 20px; font-weight: 500; }
  @media (max-width: 560px) {
    #rail { width: 76px; padding: 10px 6px; }
    .rbtn { padding: 6px; }
    .rbtn b { font-size: 13px; }
    .rbtn small { font-size: 9px; }
    .rail-h { font-size: 9px; letter-spacing: 0.1em; }
    #idle-roll { padding: 6px 2px; font-size: 12px; }
  }
  .turn { max-width: 720px; margin: 0 auto 22px; }
  .turn.gm p { margin: 0 0 0.9em; }
  .turn.gm p:last-child { margin-bottom: 0; }
  .turn.gm::before {
    content: "THE WEAVE"; display: block;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--ember); margin-bottom: 6px;
  }
  .turn.act { border-left: 2px solid var(--brass); padding: 2px 0 2px 14px; color: var(--brass); font-style: italic; white-space: pre-wrap; }
  .turn.act.pending { border-left-style: dashed; }
  .who { display: block; font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--ink-dim); margin-bottom: 2px; }
  .who .tag { color: var(--ember); margin-left: 6px; }
  .turn.pass { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); padding-left: 16px; }
  .turn.roll { font-family: var(--mono); font-size: 13px; color: var(--ink-dim); padding-left: 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .turn.roll .rw { color: var(--ink); }
  .turn.roll .rp { color: var(--brass); }
  .turn.roll .rt { color: var(--glass); font-size: 18px; font-weight: 500; }
  .turn.roll .rb { opacity: 0.7; }
  .turn.roll .tag { color: var(--ember); letter-spacing: 0.12em; font-size: 11px; }
  .turn.roll.nat20 .rt { color: var(--brass); }
  .turn.roll.nat1 .rt { color: var(--danger); }
  .turn.roll.hidden { font-style: italic; }
  .turn.roll .oc { font-size: 11px; letter-spacing: 0.14em; padding: 1px 6px; border: 1px solid currentColor; border-radius: 2px; }
  .turn.roll .oc.success, .turn.roll .oc.hit { color: var(--glass); }
  .turn.roll .oc.critical-hit { color: var(--brass); }
  .turn.roll .oc.failure, .turn.roll .oc.miss { color: var(--danger); }
  .turn.event { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-dim); text-align: center; opacity: 0.8; }
  .turn.event::before, .turn.event::after { content: " ── "; color: var(--line); }
  .turn.event.flag { color: var(--brass); }
  .turn.ooc { font-family: var(--mono); font-size: 13px; color: var(--ink-dim); padding-left: 16px; white-space: pre-wrap; }
  .turn.ooc b { color: var(--glass); font-weight: 500; }
  .turn.err { color: var(--danger); font-family: var(--mono); font-size: 13px; }
  .turn .meta { display: block; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); font-style: normal; }
  .empty { max-width: 720px; margin: 10vh auto 0; text-align: center; color: var(--ink-dim); font-style: italic; }
  .thinking { max-width: 720px; margin: 0 auto 22px; color: var(--ink-dim); font-style: italic; }
  .thinking::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  form.input { border-top: 1px solid var(--line); background: var(--bg-2); padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  .waiting { max-width: 720px; margin: 0 auto 8px; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .waiting b { color: var(--ember); font-weight: 500; }
  .waiting button { margin-left: 6px; }
  .input-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--bg); border: 1px solid var(--line); border-radius: 2px;
    padding: 10px 12px; min-height: 48px; max-height: 40vh; outline: none; line-height: 1.5;
  }
  textarea:focus { border-color: var(--brass); }
  .hint { max-width: 720px; margin: 6px auto 0; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }

  /* ---------- codex drawer ---------- */
  #codex {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line); box-shadow: -20px 0 60px rgba(0,0,0,0.5);
    transform: translateX(100%); transition: transform 0.22s ease;
    display: flex; flex-direction: column; z-index: 20;
  }
  #codex.open { transform: none; }
  .codex-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .codex-head h2 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: 0.14em; font-size: 20px; }
  .tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button {
    background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; cursor: pointer; white-space: nowrap;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--ink-dim);
  }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ember); }
  .codex-body { flex: 1; overflow-y: auto; padding: 18px 16px 32px; font-size: 17px; }
  .codex-status { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); padding: 8px 16px; border-top: 1px solid var(--line); }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 15; display: none; }
  .scrim.open { display: block; }

  .md h1, .md h2, .md h3 { font-family: var(--display); font-weight: 600; color: var(--brass); line-height: 1.25; margin: 1.2em 0 0.4em; }
  .md h1 { font-size: 26px; } .md h2 { font-size: 22px; } .md h3 { font-size: 19px; }
  .md > :first-child { margin-top: 0; }
  .md p { margin: 0 0 0.8em; }
  .md ul { margin: 0 0 0.8em; padding-left: 1.2em; }
  .md li { margin-bottom: 0.25em; }
  .md code { font-family: var(--mono); font-size: 0.85em; color: var(--glass); }
  .md .tbl { overflow-x: auto; margin: 0 0 1em; }
  .md table { border-collapse: collapse; font-size: 14px; width: 100%; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .md th { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase; font-weight: 500; background: var(--bg-2); }
  .md blockquote { margin: 0 0 1em; padding: 6px 12px; border-left: 2px solid var(--brass); color: var(--ink); background: var(--bg-2); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }

  .clock { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--ember); margin-bottom: 14px; }
  .card { border: 1px solid var(--line); background: var(--bg-2); padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--ink); }
  .kv { display: grid; grid-template-columns: minmax(90px, 32%) 1fr; gap: 4px 12px; font-size: 15px; }
  .kv dt { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase; padding-top: 3px; }
  .kv dd { margin: 0; }
  .muted { color: var(--ink-dim); font-style: italic; }

  /* table tab */
  .seat-row { border: 1px solid var(--line); background: var(--bg-2); padding: 12px; margin-bottom: 10px; display: grid; gap: 8px; }
  .seat-row .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .seat-row .top b { font-family: var(--display); font-size: 20px; font-weight: 600; }
  .seat-row .mine { font-family: var(--mono); font-size: 11px; color: var(--brass); letter-spacing: 0.12em; }
  .seat-row .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seat-row .field { padding: 7px 10px; font-size: 13px; }
  .seat-row .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .set-h { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--brass); margin: 18px 0 4px; }
  .set-h:first-child { margin-top: 0; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--bg-2); padding: 8px 10px; margin-bottom: 6px; }
  .set-row small { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .ghost.danger { border-color: rgba(192,83,63,0.5); color: var(--danger); }
  .ghost.danger:hover { border-color: var(--danger); color: var(--ink); background: rgba(192,83,63,0.25); }
  .ghost:disabled { opacity: 0.4; cursor: default; }
  .set-foot { margin-top: 22px; }
  .card.faded { opacity: 0.6; }
  .gm-only { margin-top: 10px; border-top: 1px dashed var(--ember-dim); padding-top: 8px; }
  .gm-only > span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: var(--ember); }
  .switch { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; cursor: pointer; margin: 4px 0 6px; }
  .switch input { width: 16px; height: 16px; accent-color: var(--ember); }
  .warn { border-left: 2px solid var(--ember); padding: 4px 10px; font-size: 15px; color: var(--ink); margin: 0 0 10px; }
  .ok-msg { border-left: 2px solid var(--glass); padding: 4px 10px; font-size: 15px; margin: 0 0 10px; }
  .small { font-size: 14px; }
  .edit-card { display: grid; gap: 8px; }
  .edit-card.dirty { border-color: var(--ember-dim); }
  .edit-card h3 { margin-bottom: 0; }
  .ename { font-family: var(--display); font-size: 22px; font-weight: 600; padding: 6px 10px; }
  .erows { display: grid; gap: 6px; }
  .erow { display: grid; grid-template-columns: minmax(80px, 30%) 1fr auto; gap: 6px; align-items: start; }
  .erow label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase; padding-top: 9px; }
  .meta-row, .edit-card > .erow:has(label) { grid-template-columns: minmax(80px, 30%) 1fr; }
  .erow .field { padding: 6px 9px; font-size: 13px; }
  .erow textarea.field { resize: vertical; min-height: 34px; font-family: var(--mono); }
  .ebar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .emsg { flex: 1; font-family: var(--mono); font-size: 11px; color: var(--danger); min-width: 80px; }
  .turn.roll .oc.miscant { color: var(--danger); border-style: double; }
  .turn.roll .oc.back-on-their-feet { color: var(--brass); }
  .turn.roll .luck { font-family: var(--mono); font-size: 11px; background: transparent; border: 1px solid var(--brass); color: var(--brass); border-radius: 2px; padding: 1px 7px; cursor: pointer; }
  .turn.roll .luck:hover { background: var(--brass); color: var(--bg); }
  .turn.roll .rf { font-size: 11px; color: var(--ink-dim); opacity: 0.8; }
  .chip button.make { border-color: var(--ember); color: var(--ember); }
  .chip button.make:hover { background: var(--ember); color: var(--bg); }

  /* character sheets */
  .sheet h3 small { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-dim); font-weight: 400; margin-left: 6px; }
  .sheet .vit { font-family: var(--mono); font-size: 12px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 10px; }
  .sheet .vit .bad { color: var(--danger); }
  .sheet .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .sheet .stat { border: 1px solid var(--line); padding: 6px; text-align: center; position: relative; }
  .sheet .stat.cap { border-color: var(--brass); }
  .sheet .stat small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-dim); text-transform: uppercase; }
  .sheet .stat b { font-family: var(--display); font-size: 24px; font-weight: 600; }
  .sheet .stat i { font-family: var(--mono); font-size: 11px; font-style: normal; color: var(--ink-dim); margin-left: 4px; }
  .sheet .stat button { position: absolute; top: 3px; right: 3px; font-family: var(--mono); font-size: 11px; background: transparent; border: 1px solid var(--ember); color: var(--ember); border-radius: 2px; padding: 0 5px; cursor: pointer; }
  .sheet .stat button:disabled { opacity: 0.3; cursor: default; }
  .sheet .notice { border-left: 2px solid var(--ember); padding: 4px 10px; font-size: 15px; margin: 0 0 10px; }
  .sheet .notice button { margin: 4px 4px 0 0; }
  .sheet .sk { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 10px; }
  .sheet .sk td { border-bottom: 1px solid var(--line); padding: 3px 4px; }
  .sheet .sk tr.zero td { color: var(--ink-dim); opacity: 0.7; }
  .sheet .sk td.r { font-family: var(--mono); font-size: 11px; text-align: right; white-space: nowrap; }
  .sheet .bar { display: inline-block; width: 60px; height: 4px; background: var(--line); vertical-align: middle; margin-left: 6px; }
  .sheet .bar span { display: block; height: 100%; background: var(--ember); }
  .sheet .items { margin: 0 0 10px; padding: 0; list-style: none; font-size: 15px; }
  .sheet .items li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 3px 0; }
  .sheet .items small { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
  .sheet h4 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--ink-dim); font-weight: 500; margin: 12px 0 4px; }
  .sheet .back { white-space: pre-wrap; font-size: 15px; }

  /* creation */
  .create-ov { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 4vh 12px; }
  .create { width: 100%; max-width: 680px; background: var(--panel); border: 1px solid var(--brass); padding: 20px; display: grid; gap: 10px; }
  .create h2 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: 0.14em; color: var(--brass); }
  .create .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--ink-dim); text-transform: uppercase; margin-top: 6px; }
  .create .lbl small { text-transform: none; letter-spacing: 0; font-style: italic; }
  .create textarea.field { resize: vertical; font-family: var(--body); font-size: 16px; }
  .cr-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .cr-stat { display: grid; grid-template-columns: 1fr auto auto auto auto; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 5px 8px; }
  .cr-stat span { font-family: var(--mono); font-size: 12px; }
  .cr-stat b { font-family: var(--display); font-size: 22px; min-width: 1.6em; text-align: center; }
  .cr-stat i { font-family: var(--mono); font-size: 11px; font-style: normal; color: var(--ink-dim); min-width: 2.4em; }
  .cr-stat button { background: transparent; border: 1px solid var(--line); color: var(--ink); width: 26px; height: 26px; cursor: pointer; border-radius: 2px; }
  .cr-stat button:disabled { opacity: 0.3; cursor: default; }
  .cr-bal { font-family: var(--mono); font-size: 13px; }
  .cr-bal.even { color: var(--glass); } .cr-bal.over { color: var(--danger); } .cr-bal.left { color: var(--ember); }
  .cr-derived { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .cr-kit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; font-size: 14px; }
  .cr-kit h5 { margin: 4px 0 2px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--ink-dim); font-weight: 500; }
  .cr-kit label { display: flex; gap: 6px; align-items: baseline; cursor: pointer; }
  .cr-kit input { accent-color: var(--ember); }
  @media (max-width: 600px) { .cr-stats, .cr-kit { grid-template-columns: 1fr; } .sheet .stats { grid-template-columns: repeat(2, 1fr); } }
  .turn.sys { border: 1px dashed var(--line); padding: 12px 14px; font-size: 16px; background: rgba(26,23,20,0.6); }
  .turn.sys::before {
    content: attr(data-label); display: block;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--glass); margin-bottom: 6px;
  }

  @media (max-width: 560px) {
    body { font-size: 17px; }
    .gate-card h1 { font-size: 40px; }
    .hint { display: none; }
    .seat-row .fields { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- 1. The gate -->
<section id="gate" class="screen">
  <div class="gate-card">
    <div class="sigil"><span>E</span></div>
    <h1>EIDHOLM</h1>
    <p class="sub">The machines are listening.</p>
    <form id="gate-form" class="gate-row" autocomplete="off">
      <input id="pw" class="field" type="password" placeholder="Speak the word" aria-label="Game password" autofocus>
      <button class="btn" type="submit">Enter</button>
    </form>
    <div class="gate-msg" id="gate-msg"></div>
  </div>
</section>

<!-- 2. Take a seat -->
<section id="seats" class="screen" hidden>
  <div class="gate-card">
    <h2>Take a seat</h2>
    <p class="sub">Who sits at the table tonight?</p>
    <div class="seat-list" id="seat-list"></div>
    <div class="divider" id="seat-divider">OR A NEW SEAT</div>
    <form id="seat-form" class="stack" autocomplete="off">
      <input id="seat-player" class="field" placeholder="Your name" maxlength="40" required>
      <input id="seat-character" class="field" placeholder="Character name (optional, can come later)" maxlength="40">
      <button class="btn" type="submit">Sit down</button>
    </form>
    <div class="gate-msg" id="seat-msg"></div>
  </div>
</section>

<!-- 3. The table -->
<section id="game">
  <header class="bar">
    <div class="brand">EIDHOLM</div>
    <div class="controls">
      <span class="conn" id="conn" title="Connection to the table"></span>
      <div class="seg" role="group" aria-label="Model">
        <button type="button" data-tier="small" title="mistral-small: everyday play">Small</button>
        <button type="button" data-tier="large" title="mistral-large: climactic scenes only">Large</button>
      </div>
      <span class="meter" id="meter">0 tok · <b>$0.0000</b></span>
      <span class="meter" id="clock-stamp" title="The in-game clock"></span>
      <span class="meter" id="saved-stamp"></span>
      <button type="button" class="ghost" id="codex-open" title="Table, party, log, rules and world (no tokens spent)">Codex</button>
      <button type="button" class="ghost" id="settings-open" title="Game Master settings (username and password)">Settings</button>
      <button type="button" class="ghost" id="export" title="Download the shared scene as Markdown">Export</button>
      <button type="button" class="ghost" id="lock" title="Leave and forget the password on this device">Lock</button>
    </div>
  </header>

  <div class="roster" id="roster" aria-label="Who is at the table"></div>

  <div class="stage">
    <aside id="rail" aria-label="Your rolls">
      <div id="rail-rolls"></div>
      <div class="idle">
        <button type="button" id="idle-roll" title="Just rolling, for fun. Only you see it; it never counts.">🎲 <span id="idle-die">d20</span></button>
        <select id="idle-pick" aria-label="Which die">
          <option>d4</option><option>d6</option><option>d8</option><option>d10</option><option>d12</option><option selected>d20</option><option>d100</option>
        </select>
        <div id="idle-out" class="idle-out" aria-live="polite"></div>
      </div>
    </aside>
    <main id="log" aria-live="polite"></main>
  </div>

  <form class="input" id="chat-form">
    <div class="waiting" id="waiting"></div>
    <div class="input-inner">
      <textarea id="msg" rows="1" placeholder="What do you do?"></textarea>
      <button class="btn quiet" id="pass" type="button" title="Let the moment play out">Pass</button>
      <button class="btn" id="send" type="submit">Act</button>
    </div>
    <div class="hint">Enter to act · Shift+Enter new line · /roll rolls what the GM asked for · OOC: talks to the table · /help</div>
  </form>
</section>

<div class="scrim" id="scrim"></div>
<aside id="codex" aria-label="Codex" aria-hidden="true">
  <div class="codex-head">
    <h2>CODEX</h2>
    <div class="controls">
      <button type="button" class="ghost" id="codex-refresh" title="Pull the latest from the repo">Refresh</button>
      <button type="button" class="ghost" id="codex-close" title="Close">Close</button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" data-tab="table" class="on">TABLE</button>
    <button type="button" data-tab="party">PARTY</button>
    <button type="button" data-tab="people">PEOPLE</button>
    <button type="button" data-tab="log">LOG</button>
    <button type="button" data-tab="rules">RULES</button>
    <button type="button" data-tab="canon">WORLD</button>
    <button type="button" data-tab="settings">SETTINGS</button>
  </nav>
  <div class="codex-body" id="codex-body"></div>
  <div class="codex-status" id="codex-status"></div>
</aside>

<script>
  // Same origin as the Worker.
  const API = "";

  // Price per million tokens in USD (estimate only; edit if Mistral changes them).
  const PRICES = { small: { in: 0.15, out: 0.60 }, large: { in: 0.68, out: 2.09 } };

  const store = {
    get(area, k) { try { return window[area].getItem(k); } catch { return null; } },
    set(area, k, v) { try { window[area].setItem(k, v); } catch {} },
    del(area, k) { try { window[area].removeItem(k); } catch {} },
  };

  const $ = (id) => document.getElementById(id);
  const msg = $("msg"), log = $("log");

  let password = store.get("sessionStorage", "eidholm.pw") || "";
  let mySeat = store.get("localStorage", "eidholm.seat") || "";
  let table = null;      // latest snapshot from the server
  let rules = null;      // fixed lists from the server: stats, skills, ranks, starting kit, capstones
  let notes = [];        // local-only slash command output: { ts, label, html }
  let errors = [];       // local-only error lines: { ts, text }
  let ws = null, wsWanted = false, retry = 0;

  // ================= screens =================
  function show(which) {
    $("gate").hidden = which !== "gate";
    $("seats").hidden = which !== "seats";
    $("game").style.display = which === "game" ? "flex" : "none";
  }

  // ---------- gate ----------
  $("gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("pw").value;
    if (!pw) return;
    $("gate-msg").textContent = "";
    const ok = await checkPassword(pw);
    if (ok === true) {
      password = pw;
      store.set("sessionStorage", "eidholm.pw", pw);
      connect();
    } else {
      $("gate-msg").textContent = typeof ok === "string" ? ok : ok === false ? "The gate does not open." : "The gate is unreachable. Try again.";
      $("pw").select();
    }
  });

  async function checkPassword(pw) {
    try {
      const r = await fetch(API + "/api/check", { method: "POST", headers: { "X-Game-Password": pw } });
      if (r.status === 429) return (await r.json().catch(() => ({}))).error || "Too many wrong attempts. Try again later.";
      return r.ok ? true : r.status === 401 ? false : null;
    } catch { return null; }
  }

  function lock(message = "") {
    wsWanted = false;
    if (ws) try { ws.close(); } catch {}
    password = "";
    store.del("sessionStorage", "eidholm.pw");
    sealSettings();
    closeCodex();
    show("gate");
    $("pw").value = "";
    $("gate-msg").textContent = message;
    $("pw").focus();
  }
  $("lock").addEventListener("click", () => lock());

  // ---------- seats ----------
  function renderSeatScreen() {
    const seats = table ? table.seats : [];
    $("seat-list").innerHTML = "";
    $("seat-divider").hidden = !seats.length;
    for (const s of seats) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "seat-pick";
      b.innerHTML = "<b>" + escapeHtml(s.character || s.player) + "</b><small>" +
        (s.character ? escapeHtml(s.player) + " · " : "") + (s.present ? "present" : "absent") + "</small>";
      b.addEventListener("click", () => takeSeat(s.id));
      $("seat-list").appendChild(b);
    }
  }

  function takeSeat(id) {
    mySeat = id;
    store.set("localStorage", "eidholm.seat", id);
    route();
  }

  $("seat-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const player = $("seat-player").value.trim();
    if (!player) return;
    send({ t: "join", player, character: $("seat-character").value.trim() });
    $("seat-player").value = ""; $("seat-character").value = "";
  });

  // Decide which screen to show from the latest snapshot.
  function route() {
    if (!table) return;
    const seated = table.seats.some((s) => s.id === mySeat);
    if (!seated) { renderSeatScreen(); show("seats"); return; }
    show("game");
    render();
  }

  // ================= live connection =================
  async function connect() {
    wsWanted = true;
    let ticket;
    try {
      const r = await fetch(API + "/api/ticket", { method: "POST", headers: { "X-Game-Password": password } });
      if (r.status === 401) return lock("The word has changed.");
      if (r.status === 429) return lock((await r.json().catch(() => ({}))).error || "Too many wrong attempts. Try again later.");
      ticket = (await r.json()).ticket;
    } catch {
      return scheduleReconnect();
    }
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}${API}/api/ws?ticket=${encodeURIComponent(ticket)}`);
    ws.onopen = () => {
      retry = 0; $("conn").classList.add("live");
      // An unsealed GM proves it again on every (re)connection to see GM dice.
      if (admin) ws.send(JSON.stringify({ t: "admin", user: admin.user, pass: admin.pass }));
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === "state") {
        // A fresh scene (session ended or discarded) also clears this device's local lines.
        if (table && table.messages.length && !m.messages.length) { notes = []; errors = []; }
        table = m; route();
      }
      else if (m.t === "rules") rules = m;
      else if (m.t === "joined") takeSeat(m.seatId);
      else if (m.t === "error") pushError(m.text);
      else if (m.t === "party-changed") partyChanged();
    };
    ws.onclose = () => {
      $("conn").classList.remove("live");
      if (wsWanted) scheduleReconnect();
    };
  }

  function scheduleReconnect() {
    if (!wsWanted) return;
    retry = Math.min(retry + 1, 6);
    setTimeout(() => { if (wsWanted) connect(); }, 500 * 2 ** retry);
  }

  function send(obj) {
    if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; }
    pushError("Not connected to the table. Reconnecting…");
    return false;
  }

  function pushError(text) {
    if ($("create") && $("cr-msg")) { $("cr-msg").textContent = text; $("cr-go").disabled = false; return; }
    errors.push({ ts: Date.now(), text });
    if ($("seats").hidden === false) $("seat-msg").textContent = text;
    else render();
  }

  // ================= actions =================
  document.querySelectorAll(".seg button").forEach((b) => {
    b.addEventListener("click", () => send({ t: "tier", tier: b.dataset.tier }));
  });


  $("export").addEventListener("click", () => {
    if (!table) return;
    const stamp = new Date().toISOString().slice(0, 16).replace("T", " ");
    const body = table.messages.map((m) => {
      const who = m.character ? `${m.character} (${m.author})` : m.author;
      if (m.kind === "gm") return `**GM:**\n\n${m.text}`;
      if (m.kind === "act") return `**${who}:** ${m.text}`;
      if (m.kind === "pass") return `*${who} passes.*`;
      if (m.kind === "roll") return `🎲 **${who}** rolls ${m.label ? m.label + ": " : ""}${m.expr} = ${m.total} (${describeRoll(m)})`;
      if (m.kind === "gmroll") return m.hidden ? "🎲 *The GM rolls behind the screen.*" : `🎲 *GM* rolls ${m.purpose ? m.purpose + ": " : ""}${m.expr} = ${m.total} (${describeRoll(m)})`;
      if (m.kind === "event") return `> *${m.text}*`;
      if (m.kind === "flag") return `> *${m.author} asks the GM to remember ${m.text}.*`;
      return `> OOC ${m.author}: ${m.text}`;
    }).join("\n\n---\n\n");
    const t = totals();
    const md = `# Eidholm session export (${stamp})\n\nRound ${table.round} · ${t.tokens} tokens · est. $${t.usd.toFixed(4)}\n\n---\n\n${body}\n`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
    a.download = `eidholm-session-${stamp.replace(/[: ]/g, "-")}.md`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  msg.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chat-form").requestSubmit(); }
  });
  msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = msg.scrollHeight + "px"; });

  $("chat-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = msg.value.trim();
    if (!text) return;
    if (text.startsWith("/")) {
      clearInput();
      await runCommand(text);
      return msg.focus();
    }
    const ooc = text.match(/^ooc:\s*([\s\S]*)$/i);
    if (ooc) {
      if (ooc[1].trim() && send({ t: "ooc", seatId: mySeat, text: ooc[1].trim() })) clearInput();
      return;
    }
    if (send({ t: "act", seatId: mySeat, text })) clearInput();
  });

  $("pass").addEventListener("click", () => send({ t: "pass", seatId: mySeat }));

  // Checkpoint save: anyone at the table. Writes the transcript so far to the repo; play continues.
  let saving = false;
  async function saveNow() {
    if (saving) return;
    saving = true; render();
    try {
      const r = await fetch(API + "/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Game-Password": password },
        body: JSON.stringify({ seatId: mySeat }),
      });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) return lock("The word has changed.");
      if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    } catch (err) {
      pushError("Save failed: " + err.message);
    } finally {
      saving = false; render();
    }
  }

  function clearInput() { msg.value = ""; msg.style.height = "auto"; }

  // ================= render =================
  function seatById(id) { return table && table.seats.find((s) => s.id === id); }
  function seatLabel(s) { return s.character || s.player; }
  function pending() { return table.messages.filter((m) => m.round === table.round && (m.kind === "act" || m.kind === "pass" || m.kind === "roll")); }

  function totals() {
    let tokens = 0, usd = 0;
    for (const tier of ["small", "large"]) {
      const s = (table && table.spend[tier]) || { in: 0, out: 0 };
      tokens += s.in + s.out;
      usd += (s.in * PRICES[tier].in + s.out * PRICES[tier].out) / 1e6;
    }
    return { tokens, usd };
  }

  function render() {
    if (!table) return;
    const me = seatById(mySeat);
    const pend = pending();
    // A seat's status: acted beats rolled beats passed.
    const answered = new Map();
    for (const m of pend) {
      const cur = answered.get(m.seatId);
      if (!cur || m.kind === "act" || (m.kind === "roll" && cur === "pass")) answered.set(m.seatId, m.kind);
    }
    const retractable = pend.some((m) => m.seatId === mySeat && (m.kind === "act" || m.kind === "pass"));

    // header
    document.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("on", b.dataset.tier === table.tier));
    const t = totals();
    $("meter").innerHTML = `${t.tokens.toLocaleString()} tok · <b>$${t.usd.toFixed(4)}</b>`;
    $("clock-stamp").textContent = table.clock ? "⧗ " + table.clock + (table.partyUnsaved ? " · sheets unsaved" : "") : "";
    if ($("create") && mySheet() && mySheet().name === $("create").dataset.want) closeCreate();
    $("saved-stamp").textContent = table.saved
      ? `Saved ${new Date(table.saved.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}${table.saved.by ? " by " + table.saved.by : ""}`
      : "";

    // roster
    const roster = $("roster");
    roster.innerHTML = "";
    for (const s of table.seats) {
      const chip = document.createElement("div");
      chip.className = "chip" + (s.id === mySeat ? " me" : "") + (s.present ? "" : " absent");
      const st = !s.present ? ["absent", ""] : answered.get(s.id) === "act" ? ["acted", "acted"]
        : answered.get(s.id) === "roll" ? ["rolled", "acted"]
        : answered.get(s.id) === "pass" ? ["passed", "passed"] : ["waiting", ""];
      chip.innerHTML = `<span class="name">${escapeHtml(seatLabel(s))}</span><span class="status ${st[1]}">${st[0]}</span>`;
      if (s.id === mySeat) {
        const sv = document.createElement("button");
        sv.type = "button"; sv.className = "save";
        sv.textContent = saving ? "Saving…" : "Save";
        sv.disabled = saving;
        sv.title = "Save the session so far to the repo. Play continues.";
        sv.addEventListener("click", saveNow);
        chip.appendChild(sv);
        if (table.party && !mySheet()) {
          const mk = document.createElement("button");
          mk.type = "button"; mk.className = "make"; mk.textContent = "Create character";
          mk.title = "Make your character: stats, backstory and starting kit";
          mk.addEventListener("click", openCreate);
          chip.appendChild(mk);
        }
      }
      const tog = document.createElement("button");
      tog.type = "button";
      tog.textContent = s.present ? "Mark absent" : "Mark present";
      tog.title = s.present ? "Mark this character absent" : "Mark this character present";
      tog.addEventListener("click", () => send({ t: "seat", id: s.id, patch: { present: !s.present } }));
      chip.appendChild(tog);
      roster.appendChild(chip);
    }

    renderRail(me);

    // log: shared messages merged with this device's local notes and errors
    const items = [
      ...table.messages.map((m) => ({ ts: m.ts, m })),
      ...notes.map((n) => ({ ts: n.ts, note: n })),
      ...errors.map((e) => ({ ts: e.ts, err: e })),
    ].sort((a, b) => a.ts - b.ts);

    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
    log.innerHTML = "";
    if (!items.length) {
      log.innerHTML = '<div class="empty">The continent waits. Tell the Weave who you are, or ask it to begin.</div>';
    }
    for (const it of items) {
      const div = document.createElement("div");
      if (it.note) {
        div.className = "turn sys md"; div.dataset.label = it.note.label; div.innerHTML = it.note.html;
      } else if (it.err) {
        div.className = "turn err"; div.textContent = it.err.text;
      } else {
        const m = it.m;
        const who = m.character ? `${m.character} · ${m.author}` : m.author;
        const isPend = m.round === table.round && (m.kind === "act" || m.kind === "pass");
        if (m.kind === "gm") {
          div.className = "turn gm";
          div.innerHTML = formatProse(m.text);
          const u = m.usage || {};
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = `${m.model || ""} · ${u.total_tokens || "?"} tok`;
          div.appendChild(meta);
        } else if (m.kind === "act") {
          div.className = "turn act" + (isPend ? " pending" : "");
          div.innerHTML = `<span class="who">${escapeHtml(who.toUpperCase())}${isPend ? '<span class="tag">PENDING</span>' : ""}</span>`;
          div.appendChild(document.createTextNode(m.text));
        } else if (m.kind === "pass") {
          div.className = "turn pass";
          div.textContent = `${who} passes${isPend ? " (pending)" : ""}.`;
        } else if (m.kind === "roll" || m.kind === "gmroll") {
          div.className = "turn roll" + (m.nat === 20 ? " nat20" : m.nat === 1 ? " nat1" : "") + (m.hidden ? " hidden" : "");
          if (m.hidden) {
            div.textContent = "🎲 The GM rolls behind the screen.";
          } else {
            const by = m.kind === "gmroll" ? "GM" : who;
            const what = m.label || m.purpose;
            const secret = m.kind === "gmroll" && !table.revealGmRolls ? '<span class="tag">ONLY YOU SEE THIS</span>' : "";
            const ctx = [];
            if (m.dc != null) ctx.push("DC " + m.dc);
            if (m.ac != null) ctx.push("vs AC " + m.ac);
            if (m.mode === "adv") ctx.push("advantage");
            if (m.mode === "dis") ctx.push("disadvantage");
            if (!m.mode && m.adv?.length && m.dis?.length) ctx.push("adv + dis cancel");
            if (m.crit) ctx.push("critical: dice doubled");
            if (m.spellTier) ctx.push("tier " + m.spellTier + " cant");
            const oc = m.outcome ? `<span class="oc ${m.outcome.replace(/\s+/g, "-")}">${escapeHtml(m.outcome.toUpperCase())}</span>` : "";
            div.innerHTML = `<span class="die">🎲</span><span class="rw">${escapeHtml(by)}</span> rolls ` +
              (what ? `<span class="rp">${escapeHtml(what)}</span> ` : "") +
              (ctx.length ? `<span class="rb">(${escapeHtml(ctx.join(" · "))})</span> ` : "") +
              `<span class="rx">${escapeHtml(m.expr)}</span> → <b class="rt">${m.total}</b>` +
              `<span class="rb">${escapeHtml(describeRoll(m))}</span>` +
              (m.nat === 20 ? '<span class="tag">NATURAL 20</span>' : m.nat === 1 ? '<span class="tag">NATURAL 1</span>' : "") + oc + secret +
              (m.modFrom ? `<span class="rf">${escapeHtml(m.modFrom)}</span>` : "");
            const mine = mySheet();
            if (m.kind === "roll" && m.seatId === mySeat && m.round === table.round && !table.resolving && mine &&
                ["check", "save", "attack", "death"].includes(m.rtype) && mine.d.luckyBreaks - (mine.luckUsed || 0) > 0) {
              const lb = document.createElement("button");
              lb.type = "button"; lb.className = "luck";
              lb.textContent = `Lucky break (${mine.d.luckyBreaks - (mine.luckUsed || 0)} left)`;
              lb.title = "Reroll this. The new result stands.";
              lb.addEventListener("click", () => send({ t: "luck", seatId: mySeat, msgId: m.id }));
              div.appendChild(lb);
            }
          }
        } else if (m.kind === "flag") {
          div.className = "turn event flag";
          div.textContent = `${m.author} asks the GM to remember ${m.text}.`;
        } else if (m.kind === "event") {
          div.className = "turn event";
          div.textContent = m.text;
        } else if (m.kind === "ooc") {
          div.className = "turn ooc";
          div.innerHTML = `<b>${escapeHtml(m.author)}:</b> `;
          div.appendChild(document.createTextNode(m.text));
        }
      }
      log.appendChild(div);
    }
    if (table.resolving) {
      const th = document.createElement("div");
      th.className = "thinking"; th.textContent = "The Weave is listening";
      log.appendChild(th);
    }
    if (nearBottom || table.resolving) log.scrollTop = log.scrollHeight;

    // status line above the input
    const w = $("waiting");
    w.innerHTML = "";
    if (me && !me.present) {
      w.innerHTML = `<b>${escapeHtml(seatLabel(me))}</b> is marked absent. `;
      const b = document.createElement("button");
      b.type = "button"; b.className = "ghost"; b.textContent = "I'm here";
      b.addEventListener("click", () => send({ t: "seat", id: me.id, patch: { present: true } }));
      w.appendChild(b);
    } else if (table.resolving) {
      w.textContent = "The GM is answering…";
    } else if (table.graceUntil && table.graceUntil > Date.now()) {
      const left = Math.max(1, Math.ceil((table.graceUntil - Date.now()) / 1000));
      w.innerHTML = `Rolled. The GM answers in <b>${left}s</b>, unless a lucky break is spent. `;
      const k = document.createElement("button");
      k.type = "button"; k.className = "ghost"; k.textContent = "Keep it, go on";
      k.addEventListener("click", () => send({ t: "resolve" }));
      w.appendChild(k);
      clearTimeout(render.tick); render.tick = setTimeout(render, 1000);
    } else if (table.party && !mySheet() && !pend.length) {
      w.innerHTML = "You don't have a character sheet yet. ";
      const b = document.createElement("button");
      b.type = "button"; b.className = "ghost"; b.textContent = "Create character";
      b.addEventListener("click", openCreate);
      w.appendChild(b);
    } else {
      const owes = (id) => (table.requests || []).some((r) => r.seatId === id);
      const waitingOn = table.seats.filter((s) => s.present && (!answered.has(s.id) || owes(s.id))).map(seatLabel);
      if ((table.requests || []).some((r) => r.seatId === mySeat) && !pend.length) {
        w.textContent = "The GM wants rolls from you. Use the buttons on the left, or /roll for all of them.";
      } else if (pend.length) {
        w.innerHTML = waitingOn.length
          ? `Waiting on <b>${waitingOn.map(escapeHtml).join(", ")}</b>. `
          : "Everyone has answered. ";
        if (retractable) {
          const r = document.createElement("button");
          r.type = "button"; r.className = "ghost"; r.textContent = "Take mine back";
          r.addEventListener("click", () => send({ t: "retract", seatId: mySeat }));
          w.appendChild(r);
        }
        const go = document.createElement("button");
        go.type = "button"; go.className = "ghost"; go.textContent = "Resolve now";
        go.title = "Let the GM answer without waiting for the others";
        go.addEventListener("click", () => send({ t: "resolve" }));
        w.appendChild(go);
      } else {
        w.textContent = `Round ${table.round} · the GM answers once every present character has acted, rolled or passed.`;
      }
    }
    const blocked = !me || !me.present || table.resolving;
    $("send").disabled = blocked;
    $("pass").disabled = blocked || (table.requests || []).some((r) => r.seatId === mySeat);

    if ($("codex").classList.contains("open") && codexTab === "table") renderTableTab();
    if ($("codex").classList.contains("open") && codexTab === "party" && !(admin && admin.canWriteRepo)) renderPartyTab();
    if ($("codex").classList.contains("open") && codexTab === "settings" && admin) {
      renderSettingsSeats();
      if ($("reveal-toggle")) $("reveal-toggle").checked = !!table.revealGmRolls;
    }
  }

  // The rolls this seat owes the GM, one button each, in order.
  function renderRail(me) {
    const box = $("rail-rolls");
    const mine = (table.requests || []).filter((r) => r.seatId === mySeat).sort((a, b) => a.order - b.order);
    const sig = JSON.stringify([mine.map((r) => [r.rid, r.mod, r.autoDis]), !!(me && me.present), table.resolving]);
    if (box.dataset.sig === sig) return;   // don't rebuild (and re-animate) when nothing changed
    box.dataset.sig = sig;
    box.innerHTML = "";
    if (!mine.length) return;
    const blocked = !me || !me.present || table.resolving;
    const h = document.createElement("div");
    h.className = "rail-h"; h.textContent = "YOUR ROLLS";
    box.appendChild(h);
    mine.forEach((r, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "rbtn"; b.disabled = blocked;
      const dice = ["check", "save", "attack", "death"].includes(r.type) ? "d20" : (r.dice || "d20");
      const dis = [...(r.dis || []), ...(r.autoDis || [])];
      const net = r.adv?.length && !dis.length ? "advantage" : dis.length && !r.adv?.length ? "disadvantage" : (r.adv?.length && dis.length ? "adv + dis cancel" : "");
      const bits = [dice + fmtMod(r.mod)];
      if (r.dc != null) bits.push("DC " + r.dc);
      if (r.ac != null) bits.push("AC " + r.ac);
      if (net) bits.push(net);
      if (r.damage) bits.push("then " + r.damage.dice + fmtMod(r.damage.mod) + " on a hit");
      b.innerHTML = `<span class="n">${i + 1}</span><b>${escapeHtml(r.label)}</b><small>${escapeHtml(bits.join(" · "))}</small>`;
      if (r.type === "death") bits.push("10+ holds on");
      if (r.spellTier) bits.push("tier " + r.spellTier + " cant");
      const why = [...(r.modFrom ? [r.modFrom] : []), ...(r.adv || []).map((x) => "+ " + x), ...dis.map((x) => "− " + x)];
      if (why.length) b.title = why.join("\n");
      b.addEventListener("click", () => send({ t: "rollRequest", rid: r.rid }));
      box.appendChild(b);
    });
    if (mine.length > 1) {
      const all = document.createElement("button");
      all.type = "button"; all.className = "ghost rall"; all.textContent = "Roll all (/roll)"; all.disabled = blocked;
      all.addEventListener("click", () => send({ t: "rollAll", seatId: mySeat }));
      box.appendChild(all);
    }
  }

  function fmtMod(n) { n = Number(n) || 0; return n > 0 ? "+" + n : n < 0 ? String(n) : ""; }

  // The idle die: local only, for fidgeting while others finish. Never counts.
  $("idle-pick").addEventListener("change", (e) => { $("idle-die").textContent = e.target.value; });
  $("idle-roll").addEventListener("click", () => {
    const sides = Number($("idle-pick").value.slice(1));
    const limit = Math.floor(0x100000000 / sides) * sides;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    const v = (buf[0] % sides) + 1;
    $("idle-out").innerHTML = `<b>${v}</b>`;
  });

  function formatProse(text) {
    return String(text).split(/\n{2,}/).map((p) => "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("");
  }

  // ================= codex =================
  let codexState = null;
  let codexTab = "table";

  async function loadState(force = false) {
    if (codexState && !force) return codexState;
    $("codex-status").textContent = "Reading the repo…";
    const r = await fetch(API + "/api/state", { method: "POST", headers: { "X-Game-Password": password } });
    if (r.status === 401) { lock("The word has changed."); throw new Error("locked"); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { $("codex-status").textContent = data.error || ("HTTP " + r.status); throw new Error(data.error || ("HTTP " + r.status)); }
    codexState = data;
    $("codex-status").textContent = "Loaded from repo at " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    return codexState;
  }

  function openCodex() {
    $("codex").classList.add("open"); $("scrim").classList.add("open");
    $("codex").setAttribute("aria-hidden", "false");
    renderCodex();
  }
  function closeCodex() {
    $("codex").classList.remove("open"); $("scrim").classList.remove("open");
    $("codex").setAttribute("aria-hidden", "true");
  }
  $("codex-open").addEventListener("click", openCodex);
  $("codex-close").addEventListener("click", () => { closeCodex(); msg.focus(); });
  $("scrim").addEventListener("click", closeCodex);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("codex").classList.contains("open")) closeCodex(); });
  $("codex-refresh").addEventListener("click", () => renderCodex(true));
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    codexTab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
    renderCodex();
  }));

  function openTab(tab) {
    codexTab = tab;
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x.dataset.tab === tab));
    openCodex();
  }
  $("settings-open").addEventListener("click", () => openTab("settings"));

  async function renderCodex(force = false) {
    const body = $("codex-body");
    if (codexTab === "table") { renderTableTab(); return; }
    if (codexTab === "settings") { renderSettings(force); return; }
    if (codexTab === "people") { renderPeople(); return; }
    if (!codexState || force) body.innerHTML = '<p class="muted">Reading the repo…</p>';
    let st;
    try { st = await loadState(force); } catch (err) {
      if (err.message !== "locked") body.innerHTML = '<p class="muted">Could not read the repo: ' + escapeHtml(err.message) + "</p>";
      return;
    }
    if (codexTab === "table" || codexTab === "settings" || codexTab === "people") return;
    body.className = "codex-body md";
    if (codexTab === "party") {
      if (admin && admin.canWriteRepo) { renderPartyEditor(st); return; }
      renderPartyTab();
    }
    else if (codexTab === "log") body.innerHTML = renderMarkdown(st.log) || '<p class="muted">No log yet.</p>';
    else if (codexTab === "rules") body.innerHTML = (renderMarkdown(st.rules) + (st.economy ? "<hr>" + renderMarkdown(st.economy) : "")) || '<p class="muted">No rules yet.</p>';
    else body.innerHTML = renderMarkdown(st.canon) || '<p class="muted">No canon found.</p>';
    body.scrollTop = 0;
  }

  // The Table tab manages seats. It is live: changes sync to everyone instantly.
  function renderTableTab() {
    const body = $("codex-body");
    body.className = "codex-body";
    $("codex-status").textContent = "Live · changes sync to everyone at the table";
    // Don't rebuild while someone is typing in a field here.
    if (body.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
    body.innerHTML = "";
    if (!table) return;
    const intro = document.createElement("p");
    intro.className = "muted";
    intro.textContent = "Mark who is here before the session starts. Absent characters are elsewhere in the story, and the GM won't wait for them.";
    body.appendChild(intro);
    for (const s of table.seats) {
      const row = document.createElement("div");
      row.className = "seat-row";
      row.innerHTML = `<div class="top"><b>${escapeHtml(seatLabel(s))}</b>${s.id === mySeat ? '<span class="mine">YOU</span>' : ""}</div>
        <div class="fields">
          <input class="field" data-k="player" maxlength="40" placeholder="Player name" value="${escapeHtml(s.player)}">
          <input class="field" data-k="character" maxlength="40" placeholder="Character name" value="${escapeHtml(s.character || "")}">
        </div>
        <div class="actions"></div>`;
      row.querySelectorAll("input").forEach((inp) => {
        const save = () => {
          if ((s[inp.dataset.k] || "") === inp.value.trim()) return;
          send({ t: "seat", id: s.id, patch: { [inp.dataset.k]: inp.value } });
        };
        inp.addEventListener("change", save);
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } });
      });
      const act = row.querySelector(".actions");
      const mk = (text, fn, title) => { const b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = text; b.title = title || ""; b.addEventListener("click", fn); act.appendChild(b); };
      mk(s.present ? "Present · mark absent" : "Absent · mark present", () => send({ t: "seat", id: s.id, patch: { present: !s.present } }), "Toggle presence");
      if (s.id !== mySeat) mk("Sit here", () => { takeSeat(s.id); renderTableTab(); }, "Play this seat from this device");
      body.appendChild(row);
    }
    const add = document.createElement("button");
    add.type = "button"; add.className = "ghost"; add.textContent = "Switch seat / add someone";
    add.addEventListener("click", () => { closeCodex(); mySeat = ""; store.del("localStorage", "eidholm.seat"); route(); });
    body.appendChild(add);
  }

  // ================= settings (Game Master only) =================
  // A second gate: admin username + password, checked by the server on every call.
  let admin = null;   // { user, pass, canWriteRepo } once unlocked, this tab only
  try { admin = JSON.parse(store.get("sessionStorage", "eidholm.admin") || "null"); } catch { admin = null; }

  async function adminCall(action, body = {}, creds = admin) {
    const r = await fetch(API + "/api/admin/" + action, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Game-Password": password,
        "X-Admin-User": encodeURIComponent(creds.user),
        "X-Admin-Password": encodeURIComponent(creds.pass),
      },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { lock("The word has changed."); throw new Error("locked"); }
    if (r.status === 403) { sealSettings(); throw new Error(data.error || "The settings stay sealed."); }
    if (r.status === 429) { sealSettings(); throw new Error(data.error || "Too many wrong attempts. Try again later."); }
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  }

  function sealSettings() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "admin", off: true }));
    admin = null;
    store.del("sessionStorage", "eidholm.admin");
  }

  function renderSettings(force = false) {
    const body = $("codex-body");
    body.className = "codex-body";
    if (!admin) {
      $("codex-status").textContent = "Sealed";
      body.innerHTML = `<p class="muted">Game Master settings. Players don't need this.</p>
        <form id="admin-form" class="stack" autocomplete="off">
          <input id="admin-user" class="field" placeholder="Username" autocomplete="username" required>
          <input id="admin-pass" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
          <button class="btn" type="submit">Unseal</button>
        </form>
        <div class="gate-msg" id="admin-msg"></div>`;
      $("admin-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const creds = { user: $("admin-user").value, pass: $("admin-pass").value };
        $("admin-msg").textContent = "";
        try {
          const res = await adminCall("check", {}, creds);
          admin = { ...creds, canWriteRepo: res.canWriteRepo };
          send({ t: "admin", user: creds.user, pass: creds.pass });
          store.set("sessionStorage", "eidholm.admin", JSON.stringify(admin));
          renderSettings();
          if (admin.canWriteRepo) $("codex-status").textContent = "Unsealed · the Party tab is now editable";
        } catch (err) {
          if (err.message !== "locked") $("admin-msg").textContent = err.message;
        }
      });
      $("admin-user").focus();
      return;
    }
    $("codex-status").textContent = "Unsealed · every action is checked by the server";
    body.innerHTML = `<h3 class="set-h">The GM's dice</h3>
      <p class="muted">You always see every roll the GM makes while Settings are unsealed. Players only see "the GM rolls behind the screen", unless you show them.</p>
      <label class="switch"><input type="checkbox" id="reveal-toggle" ${table && table.revealGmRolls ? "checked" : ""}> Show GM rolls to the party</label>
      <h3 class="set-h">The session</h3>
      <p class="muted">End session archives the whole scene word for word, adds your summary to the campaign log, updates the world clock, all as one commit, then clears the scene. Seats stay.</p>
      <div id="set-session"></div>
      <h3 class="set-h">Seats at the table</h3>
      <p class="muted">Removes the seat for everyone, right now. The scene and the party file are untouched.</p>
      <div id="set-seats"></div>
      <h3 class="set-h">Characters in the party file</h3>
      <p class="muted">Deletes the permanent sheet from <code>characters/party.json</code> with a commit, so it can always be recovered from the repo history.</p>
      <div id="set-party"><p class="muted">Reading the repo…</p></div>
      <div class="set-foot"><button type="button" class="ghost" id="admin-seal">Seal settings</button></div>`;
    $("admin-seal").addEventListener("click", () => { sealSettings(); renderSettings(); });
    $("reveal-toggle").addEventListener("change", (e) => send({ t: "reveal", on: e.target.checked }));
    renderSettingsSeats();
    renderSettingsParty(force);
    renderSessionIdle();
  }

  function renderSessionIdle(notice = "") {
    const box = $("set-session");
    if (!box) return;
    const st = table && table.saved
      ? `<p class="muted small">Session ${table.saved.no} last saved at ${new Date(table.saved.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}${table.saved.by ? " by " + escapeHtml(table.saved.by) : ""}. Anyone at the table can press <b>Save</b> on their own seat chip; only you can end the session.</p>`
      : '<p class="muted small">Not saved yet this session. Anyone at the table can press <b>Save</b> on their own seat chip; only you can end the session.</p>';
    box.innerHTML = (notice ? `<p class="ok-msg">${notice}</p>` : "") + st +
      `<div class="ebar"><button type="button" class="ghost" id="end-prep">End session…</button>
       <button type="button" class="ghost danger" id="discard">Discard scene</button></div>`;
    $("end-prep").addEventListener("click", prepareEndSession);
    $("discard").addEventListener("click", async () => {
      if (!confirm("Throw away the current scene WITHOUT saving it? This can't be undone. (Seats stay.)")) return;
      try { await adminCall("discard-scene"); notes = []; errors = []; renderSessionIdle("Scene discarded."); }
      catch (err) { if (err.message !== "locked") alert(err.message); }
    });
  }

  async function prepareEndSession() {
    const box = $("set-session");
    box.innerHTML = '<p class="muted">Reading the scene and asking the GM for a summary draft…</p>';
    let prep;
    try { prep = await adminCall("prepare-end"); }
    catch (err) { if (err.message !== "locked") renderSessionIdle(); if (err.message !== "locked") alert(err.message); return; }
    if (!prep.messageCount) { renderSessionIdle("The scene is empty. Nothing to save."); return; }
    const warn = [];
    if (prep.draftError) warn.push(prep.draftError);
    if (prep.pending) warn.push(`${prep.pending} action(s) are still waiting for the GM. They'll be archived as unresolved.`);
    if (prep.resolving) warn.push("The GM is answering right now. Wait for it before committing.");
    box.innerHTML = `
      ${warn.map((w) => `<p class="warn">${escapeHtml(w)}</p>`).join("")}
      <div class="card edit-card">
        <div class="erow"><label>session</label><input class="field" value="Session ${prep.sessionNo} · ${escapeHtml(prep.date)}" disabled></div>
        <div class="erow"><label>title</label><input class="field" id="end-title" maxlength="120" placeholder="e.g. Ash at the Gate"></div>
        <div class="erow"><label>world clock</label><input class="field" id="end-clock" maxlength="120" value="${escapeHtml(prep.worldClock)}"></div>
        <div class="erow"><label>summary</label><textarea class="field" id="end-summary" rows="12" placeholder="- What happened&#10;- Debts and enemies&#10;- Who joined or left&#10;- Open threads"></textarea></div>
        <p class="muted small">${prep.messageCount} lines over ${prep.rounds} round(s) will be archived to <code>${escapeHtml(prep.archivePath)}</code>. Anything posted while you edit is included too.</p>
        <div class="ebar"><span class="emsg" id="end-msg"></span>
          <button type="button" class="ghost" id="end-cancel">Cancel</button>
          <button type="button" class="ghost" id="end-commit">Commit and end session</button></div>
      </div>`;
    $("end-summary").value = prep.draft || "";
    $("end-title").focus();
    $("end-cancel").addEventListener("click", () => renderSessionIdle());
    $("end-commit").addEventListener("click", async (e) => {
      const title = $("end-title").value.trim();
      const summary = $("end-summary").value.trim();
      if (!title) { $("end-msg").textContent = "Give the session a title."; return; }
      if (!summary) { $("end-msg").textContent = "Write at least a short summary."; return; }
      if (!confirm(`End session ${prep.sessionNo} "${title}" for everyone? The scene will be archived and cleared.`)) return;

      } catch (err) {

      }
    });
  }

  // ================= party editor (unsealed GMs only) =================
  // Everyone reads every sheet in the Party tab. Once Settings are unsealed on
  // this device, the same tab becomes an editor; every save is a commit.
  let editorDirty = false;

  function partyChanged() {
    codexState = null;
    const open = $("codex").classList.contains("open");
    if (!open || !(codexTab === "party" || codexTab === "settings")) return;
    if (codexTab === "settings") { if (admin) renderSettingsParty(true); return; }

  // Each value keeps its shape: numbers stay numbers, lists stay lists.
  function kindOf(v) {
    if (typeof v === "number") return "num";
    if (typeof v === "boolean") return "bool";
    if (v === null || v === undefined) return "text";
    if (Array.isArray(v) && v.every((x) => x === null || typeof x !== "object")) return "list";
    if (typeof v === "object") return "json";
    return "text";
  }
  function toEditText(v, kind) {
    if (kind === "list") return v.join(", ");
    if (kind === "json") return JSON.stringify(v, null, 2);
    if (v === null || v === undefined) return "";
    return String(v);
  }
  function fromEditText(raw, kind, key) {
    const t = raw.trim();
    if (kind === "auto") {
      if (/^-?\d+(\.\d+)?$/.test(t)) return Number(t);
      if (t === "true" || t === "false") return t === "true";
      if (/^[\[{]/.test(t)) kind = "json"; else return t;
    }
    if (kind === "num") {
      if (t === "") return null;
      const n = Number(t.replace(",", "."));
      if (Number.isNaN(n)) throw new Error(`"${key}" must be a number.`);
      return n;
    }
    if (kind === "bool") {
      if (!/^(true|false)$/i.test(t)) throw new Error(`"${key}" must be true or false.`);
      return t.toLowerCase() === "true";
    }
    if (kind === "list") return t ? t.split(",").map((x) => x.trim()).filter(Boolean) : [];
    if (kind === "json") {
      try { return JSON.parse(t || "null"); } catch { throw new Error(`"${key}" isn't valid structured data. Check brackets and quotes.`); }
    }
    return raw.replace(/\s+$/, "");
  }

    body.innerHTML = "";

    const intro = document.createElement("p");

    // world clock + location

  function characterEditor(member, isNew = false) {
    const original = isNew ? null : String(member.name || "");
    const card = document.createElement("div");
    card.className = "card edit-card";
    card.innerHTML = `<input class="field ename" data-k="__name" placeholder="Character name" value="${escapeHtml(member.name || "")}">
      <div class="erows"></div>
      <div class="ebar">
        <button type="button" class="ghost" data-act="add">+ Field</button>
        <span class="emsg"></span>
        ${isNew ? "" : '<button type="button" class="ghost" data-act="revert">Revert</button>'}
        <button type="button" class="ghost" data-act="save">${isNew ? "Create" : "Save"}</button>
      </div>`;
    const rows = card.querySelector(".erows");
    for (const [k, v] of Object.entries(member)) if (k !== "name") rows.appendChild(fieldRow(k, v, kindOf(v)));
    if (isNew) rows.appendChild(fieldRow("", "", "auto"));

    card.addEventListener("input", () => { editorDirty = true; card.classList.add("dirty"); });
    card.querySelector('[data-act="add"]').addEventListener("click", () => {
      const r = fieldRow("", "", "auto"); rows.appendChild(r); r.querySelector("input").focus();
    });
    const rv = card.querySelector('[data-act="revert"]');
    if (rv) rv.addEventListener("click", () => { card.replaceWith(characterEditor(member)); });
    card.querySelector('[data-act="save"]').addEventListener("click", async (e) => {
      const msgEl = card.querySelector(".emsg");
      msgEl.textContent = "";
      let character;
      try { character = collectCharacter(card); } catch (err) { msgEl.textContent = err.message; return; }
      e.target.disabled = true; msgEl.textContent = "Saving…";
      try {
        await adminCall("save-character", { original, character });
        codexState = null; renderCodex(true);
      } catch (err) { if (err.message !== "locked") { msgEl.textContent = err.message; e.target.disabled = false; } }
    });
    return card;
  }

  function fieldRow(key, value, kind) {
    const row = document.createElement("div");
    row.className = "erow";
    row.dataset.kind = kind;
    const text = kind === "auto" ? String(value ?? "") : toEditText(value, kind);
    const big = kind === "json" || text.length > 60 || text.includes("\n");
    row.innerHTML = `<input class="field ekey" placeholder="field" value="${escapeHtml(key)}">` +
      (big ? `<textarea class="field eval" rows="${Math.min(10, text.split("\n").length + 1)}"></textarea>` : `<input class="field eval" value="">`) +
      `<button type="button" class="ghost" title="Remove this field">✕</button>`;
    row.querySelector(".eval").value = text;
    const hint = { num: "number", bool: "true / false", list: "comma-separated", json: "structured" }[kind];
    if (hint) row.querySelector(".eval").placeholder = hint;
    row.querySelector("button").addEventListener("click", () => {
      editorDirty = true; row.closest(".edit-card").classList.add("dirty"); row.remove();
    });
    return row;
  }

  function collectCharacter(card) {
    const name = card.querySelector('[data-k="__name"]').value.trim();
    if (!name) throw new Error("Every character needs a name.");
    const out = { name };
    for (const row of card.querySelectorAll(".erow")) {
      const key = row.querySelector(".ekey").value.trim();
      const raw = row.querySelector(".eval").value;
      if (!key && !raw.trim()) continue;
      if (!key) throw new Error("A field has a value but no name.");
      if (key.toLowerCase() === "name") throw new Error('Use the name box at the top, not a field called "name".');
      if (key in out) throw new Error(`"${key}" appears twice.`);
      out[key] = fromEditText(raw, row.dataset.kind, key);
    }
    return out;
  }

  // ================= people the GM remembers =================
  // Players get the public half from /api/cast; an unsealed GM gets everything.
  async function loadCast() {
    if (admin) return (await adminCall("cast")).cast;
    const r = await fetch(API + "/api/cast", { method: "POST", headers: { "X-Game-Password": password } });
    if (r.status === 401) { lock("The word has changed."); throw new Error("locked"); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data.cast;
  }
