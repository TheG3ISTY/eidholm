name = "eidholm"
main = "api/worker.js"
compatibility_date = "2025-09-01"

# Never let a deploy (including the automatic ones from GitHub pushes) delete
# variables or secrets that were set in the Cloudflare dashboard.
keep_vars = true

# The browser client is served from web/ by the same Worker: one deploy, one URL.
[assets]
directory = "web"
binding = "ASSETS"

[vars]
MODEL = "mistral-small-latest"
MODEL_LARGE = "mistral-large-latest"
GITHUB_REPO = "TheG3ISTY/eidholm"
GITHUB_BRANCH = "main"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put GAME_PASSWORD
#   wrangler secret put MISTRAL_API_KEY
#   wrangler secret put GITHUB_TOKEN

# The shared table: one live session that every player's browser connects to.
[[durable_objects.bindings]]
name = "TABLE"
class_name = "Table"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table"]
